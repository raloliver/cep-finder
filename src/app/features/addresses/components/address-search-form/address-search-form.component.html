<form
  [formRoot]="searchForm"
  [attr.aria-label]="'addresses.search.formLabel' | translate"
  role="search"
>
  <div class="row g-3 align-items-start justify-content-center">
    <div class="col-12 col-md-7 col-lg-6">
      <app-text-field
        [field]="searchForm.cep"
        [inputId]="inputId"
        [label]="'addresses.search.label' | translate"
        [placeholder]="'addresses.search.placeholder' | translate"
        [hint]="'addresses.search.hint' | translate"
      />
    </div>
    <div class="col-12 col-md-auto d-flex gap-2 pt-2">
      <app-button type="submit" class="flex-grow-1" icon="search">
        {{ 'addresses.search.submit' | translate }}
      </app-button>
      <app-button class="flex-grow-1" type="button" icon="backspace" (click)="clear()">
        {{ 'addresses.search.clear' | translate }}
      </app-button>
    </div>
  </div>

  <output class="d-block text-center mt-3" [attr.for]="inputId">
    @if (searching()) {
      <app-loader [label]="'addresses.search.loading' | translate" />
    } @else if (address()) {
      <span
        animate.enter="fade-in"
        animate.leave="fade-out"
        class="d-inline-flex flex-wrap justify-content-center gap-2 px-3 py-2 rounded-end bg-body-tertiary border-start border-4 border-primary"
      >
        <strong class="text-primary">{{ address()?.cep }}</strong>
        <span>
          {{ address()?.logradouro }}, {{ address()?.bairro }} - {{ address()?.localidade }}/{{
            address()?.uf
          }}
        </span>
      </span>
    }
  </output>
</form>
