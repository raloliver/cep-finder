<mat-form-field class="w-100" appearance="outline" subscriptSizing="dynamic" hideRequiredMarker>
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    inputmode="numeric"
    autocomplete="postal-code"
    [id]="inputId()"
    [formField]="field()"
    [placeholder]="placeholder()"
  />
  <mat-error>{{ field()().errors()[0]?.message ?? '' | translate }}</mat-error>
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>
