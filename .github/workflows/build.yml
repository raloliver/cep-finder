name: Angular Build CI

# Trigger the workflow every time code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Match this to your local development Node version
          cache: 'npm' # Automatically caches node_modules for faster subsequent builds

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the Angular build
      - name: Run Angular Build
        run: npm run build
