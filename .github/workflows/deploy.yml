name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main # change to 'master' if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-python-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        # Replace <repo-name> with your exact GitHub repository name
        run: npx ng build --configuration production --base-href /cep-finder/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # For Angular 17+ using default build settings:
          path: 'dist/cep-finder/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
